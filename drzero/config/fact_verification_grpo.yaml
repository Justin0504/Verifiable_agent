hydra:
  searchpath:
    - file://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  max_prompt_length: 512
  max_response_length: 256
  train_batch_size: 128
  return_raw_chat: True
  shuffle: True

actor_rollout_ref:
  hybrid_engine: True
  rollout:
    name: vllm
    multi_turn:
      enable: False

custom_reward_function:
  path: verl/custom_reward/fact_verification_reward.py
  name: compute_score

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: False
  norm_adv_by_std_in_grpo: True
